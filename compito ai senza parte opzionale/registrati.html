<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piattaforma Studenti - Registrati</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Piattaforma Studenti</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="registrati.html" class="active">Registrati</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="container">
            <h2>Registrazione Nuovo Studente</h2>
            
            <div id="messageBox" class="message hidden">
                <!-- Messaggi di successo o errore verranno mostrati qui -->
            </div>

            <form id="registrationForm">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>
                    <span class="error-message" id="nomeError"></span>
                </div>

                <div class="form-group">
                    <label for="cognome">Cognome:</label>
                    <input type="text" id="cognome" name="cognome" required>
                    <span class="error-message" id="cognomeError"></span>
                </div>

                <div class="form-group">
                    <label for="dataNascita">Data di Nascita:</label>
                    <input type="date" id="dataNascita" name="dataNascita" required>
                    <span class="error-message" id="dataNascitaError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="corso">Corso:</label>
                    <select id="corso" name="corso" required>
                        <option value="" disabled selected>Seleziona un corso</option>
                        <option value="Informatica">Informatica</option>
                        <option value="Matematica">Matematica</option>
                        <option value="Fisica">Fisica</option>
                        <option value="Chimica">Chimica</option>
                        <option value="Biologia">Biologia</option>
                    </select>
                    <span class="error-message" id="corsoError"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitBtn">Registrati</button>
                    <button type="reset" id="resetBtn">Cancella</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Piattaforma Studenti</p>
    </footer>

    <script src="js/validation.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
